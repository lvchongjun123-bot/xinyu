<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8EDF5"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Open book -->
  <g transform="translate(256, 260)">
    <!-- Left page -->
    <path d="M-4,20 C-4,-90 -60,-120 -140,-100 L-140,90 C-60,70 -4,40 -4,20 Z"
          fill="url(#page)" opacity="0.95"/>
    <!-- Right page -->
    <path d="M4,20 C4,-90 60,-120 140,-100 L140,90 C60,70 4,40 4,20 Z"
          fill="url(#page)" opacity="0.95"/>
    <!-- Spine shadow -->
    <line x1="0" y1="18" x2="0" y2="95" stroke="rgba(0,0,0,0.15)" stroke-width="3"/>
    <line x1="0" y1="-105" x2="0" y2="-65" stroke="rgba(0,0,0,0.08)" stroke-width="2"/>

    <!-- Left page lines -->
    <line x1="-120" y1="-50" x2="-40" y2="-30" stroke="rgba(0,0,0,0.12)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-120" y1="-20" x2="-40" y2="0" stroke="rgba(0,0,0,0.12)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-120" y1="10" x2="-70" y2="25" stroke="rgba(0,0,0,0.12)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-120" y1="40" x2="-40" y2="55" stroke="rgba(0,0,0,0.12)" stroke-width="3" stroke-linecap="round"/>

    <!-- Right page lines -->
    <line x1="40" y1="-30" x2="120" y2="-50" stroke="rgba(0,0,0,0.12)" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="0" x2="120" y2="-20" stroke="rgba(0,0,0,0.12)" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="25" x2="120" y2="10" stroke="rgba(0,0,0,0.12)" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="55" x2="120" y2="40" stroke="rgba(0,0,0,0.12)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floating letters emerging from book -->
  <text x="160" y="100" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="rgba(255,255,255,0.9)" transform="rotate(-12, 160, 100)">a</text>
  <text x="330" y="90" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="rgba(255,255,255,0.75)" transform="rotate(8, 330, 90)">B</text>
  <text x="190" y="60" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="rgba(255,255,255,0.55)" transform="rotate(-5, 190, 60)">c</text>
</svg>
